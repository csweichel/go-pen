<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>go-pen live preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-ink-950: #07090d;
        --color-ink-900: #0f141d;
        --color-ink-800: #17202d;
        --color-panel: #11161f;
        --color-mist: #d8e2ef;
        --color-signal: #74d3ff;
        --color-ember: #ff9a57;
        --color-ready: #63d39b;
        --color-build: #f5c24f;
        --color-fault: #ff7f7f;
      }

      :root {
        color-scheme: dark;
      }

      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top, rgba(116, 211, 255, 0.08), transparent 26%),
          radial-gradient(circle at bottom, rgba(255, 154, 87, 0.08), transparent 32%),
          linear-gradient(180deg, #07090d, #0f141d 56%, #07090d);
        font-family: "Space Grotesk", sans-serif;
      }

      code,
      pre,
      input,
      select,
      textarea {
        font-family: "IBM Plex Mono", monospace;
      }
    </style>
  </head>
  <body class="text-mist antialiased">
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
