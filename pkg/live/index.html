<!doctype html>
<html>
  <head>
    <title>go-pen</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: #252525; border-bottom: 1px solid #333; }
      header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
      select, button, input[type=text], input[type=number] { background: #333; color: #e0e0e0; border: 1px solid #555; border-radius: 4px; padding: 6px 12px; font-size: 14px; }
      select, button { cursor: pointer; }
      select:hover, button:hover, input[type=text]:focus, input[type=number]:focus { border-color: #888; outline: none; }
      button:disabled { cursor: not-allowed; opacity: 0.5; border-color: #555; }
      .controls { display: flex; align-items: center; gap: 12px; margin-left: auto; }
      .opt-group { display: flex; align-items: center; gap: 8px; }
      .opt-group label { font-size: 12px; color: #bbb; display: flex; align-items: center; gap: 4px; }
      .controls label { font-size: 13px; color: #999; }
      .controls input[type=range] { width: 120px; }
      #status { font-size: 12px; padding: 2px 8px; border-radius: 3px; }
      .status-ready { background: #1a3a1a; color: #4ade80; }
      .status-building { background: #3a3a1a; color: #facc15; }
      .status-error { background: #3a1a1a; color: #f87171; }
      .hidden { display: none; }
      #workspace { flex: 1; min-height: 0; display: flex; }
      #args-sidebar {
        width: 340px;
        display: flex;
        flex-direction: column;
        border-left: 1px solid #333;
        background: #202020;
      }
      .sidebar-header {
        padding: 16px 18px;
        border-bottom: 1px solid #333;
        background: #252525;
      }
      .sidebar-header h2 {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #b8b8b8;
      }
      .sidebar-body {
        flex: 1;
        overflow: auto;
        padding: 16px 18px 18px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      #arg-fields {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .arg-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 12px;
        background: #171717;
        border: 1px solid #333;
        border-radius: 6px;
      }
      .arg-field--bool { justify-content: center; }
      .arg-label { font-size: 12px; font-weight: 600; color: #e0e0e0; }
      .arg-desc { min-height: 28px; font-size: 11px; line-height: 1.3; color: #999; }
      .arg-meta { font-size: 11px; color: #777; }
      .arg-bool { display: flex; align-items: center; gap: 8px; color: #ddd; font-size: 13px; }
      .arg-number-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .arg-number-input {
        width: 92px;
        flex: 0 0 92px;
      }
      .arg-slider {
        flex: 1 1 auto;
        min-width: 0;
        accent-color: #7dd3fc;
      }
      .arg-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .arg-raw {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .arg-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      main { flex: 1; min-width: 0; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 20px; }
      #preview-stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 100%;
        max-height: 100%;
      }
      #image { max-width: 100%; max-height: 100%; transition: transform 0.1s; background: white; }
      #interaction-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
      }
      #interaction-overlay.active {
        display: block;
        pointer-events: auto;
      }
      .interactive-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .interactive-section.hidden {
        display: none;
      }
      .interactive-tools {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .interactive-tool {
        text-align: left;
        min-height: 44px;
        line-height: 1.2;
      }
      .interactive-tool.active {
        border-color: #7dd3fc;
        background: #143040;
      }
      .interactive-help {
        font-size: 11px;
        line-height: 1.4;
        color: #8f8f8f;
      }
      .interactive-region {
        cursor: pointer;
      }
      .interactive-region:hover {
        stroke: #facc15 !important;
      }
      .interactive-label {
        font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      #buildlog {
        display: none;
        width: 100%;
        max-width: 1200px;
        height: 100%;
        max-height: 100%;
        overflow: auto;
        background: #111;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 12px;
        color: #c9d1d9;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        white-space: pre-wrap;
      }
      #error { display: none; color: #f87171; font-size: 14px; text-align: center; padding: 40px; }
      @media (max-width: 960px) {
        #workspace { flex-direction: column; }
        #args-sidebar {
          width: auto;
          max-height: 45vh;
          border-left: 0;
          border-top: 1px solid #333;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>go-pen</h1>
      <select id="sketch" class="hidden"></select>
      <div class="controls">
        <div class="opt-group">
          <label><input type="checkbox" id="opt-debug"> debug</label>
          <label><input type="checkbox" id="opt-llo"> llo</label>
          <label><input type="checkbox" id="opt-vpype"> vpype</label>
        </div>
        <label for="gcode-flavor">gcode</label>
        <select id="gcode-flavor">
          <option value="vanilla">vanilla</option>
          <option value="mk4s">mk4s</option>
        </select>
        <button type="button" id="download-gcode" disabled>download gcode</button>
        <span id="status" class="status-building">connecting…</span>
        <label>zoom</label>
        <input type="range" min="10" max="200" value="100" id="zoom"
          oninput="document.getElementById('image').style.transform='scale('+this.value/100+')'">
      </div>
    </header>
    <div id="workspace">
      <main>
        <div id="preview-stage">
          <img id="image" />
          <svg id="interaction-overlay"></svg>
        </div>
        <pre id="buildlog"></pre>
        <div id="error"></div>
      </main>
      <aside id="args-sidebar" class="hidden">
        <div class="sidebar-header">
          <h2>Args</h2>
        </div>
        <div class="sidebar-body">
          <section id="interactive-section" class="interactive-section hidden">
            <div class="arg-label">interactive</div>
            <div id="interactive-tools" class="interactive-tools"></div>
            <div id="interactive-help" class="interactive-help">Select a tool and click the preview overlay to edit persisted sketch state.</div>
          </section>
          <div id="arg-fields"></div>
          <div class="arg-actions">
            <label class="arg-raw">
              <span class="arg-label">extra args</span>
              <input type="text" id="raw-args" placeholder="variant=wave">
            </label>
            <div class="arg-buttons">
              <button type="button" id="apply-args">apply args</button>
              <button type="button" id="reset-args">reset</button>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <script>
      var svgNS = "http://www.w3.org/2000/svg";
      var previewStage = document.getElementById("preview-stage");
      var image = document.getElementById("image");
      var interactionOverlay = document.getElementById("interaction-overlay");
      var buildLog = document.getElementById("buildlog");
      var errorDiv = document.getElementById("error");
      var statusEl = document.getElementById("status");
      var sketchSelect = document.getElementById("sketch");
      var optDebug = document.getElementById("opt-debug");
      var optLLO = document.getElementById("opt-llo");
      var optVPype = document.getElementById("opt-vpype");
      var gcodeFlavorSelect = document.getElementById("gcode-flavor");
      var downloadGCodeButton = document.getElementById("download-gcode");
      var argsSidebar = document.getElementById("args-sidebar");
      var argFields = document.getElementById("arg-fields");
      var rawArgsInput = document.getElementById("raw-args");
      var applyArgsButton = document.getElementById("apply-args");
      var resetArgsButton = document.getElementById("reset-args");
      var interactiveSection = document.getElementById("interactive-section");
      var interactiveTools = document.getElementById("interactive-tools");
      var interactiveHelp = document.getElementById("interactive-help");
      var galleryMode = false;
      var currentEventType = "";
      var exportingGCode = false;
      var currentArgsState = { specs: [], values: {}, raw: "" };
      var currentInteractiveState = { manifest: { canvas: { width: 0, height: 0 }, tools: [], regions: [], defaultTool: "" } };
      var selectedInteractiveTool = "";

      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls;
      }

      function syncDownloadButton() {
        downloadGCodeButton.disabled = exportingGCode || currentEventType !== "ready";
      }

      function showImage(file) {
        image.src = "/out/" + file + "?t=" + Date.now();
        previewStage.style.display = "flex";
        buildLog.style.display = "none";
        errorDiv.style.display = "none";
        renderInteractiveOverlay();
      }

      function showBuildLog() {
        previewStage.style.display = "none";
        buildLog.style.display = "block";
        errorDiv.style.display = "none";
      }

      function appendBuildLog(line) {
        if (!line) return;
        buildLog.textContent += line + "\n";
        buildLog.scrollTop = buildLog.scrollHeight;
      }

      function applyOptimState(optim) {
        if (!optim) return;
        optLLO.checked = !!optim.llo;
        optVPype.checked = !!optim.vpype;
        optVPype.disabled = !optim.vpypeAvailable;
        if (!optim.vpypeAvailable) {
          optVPype.title = "vpype is not installed in this environment";
        } else {
          optVPype.title = "";
        }
      }

      function applyDebugState(debug) {
        optDebug.checked = !!debug;
      }

      function normalizeArgsState(state) {
        return {
          specs: (state && state.specs) || [],
          values: (state && state.values) || {},
          raw: (state && state.raw) || ""
        };
      }

      function normalizeInteractiveState(state) {
        var manifest = (state && state.manifest) || {};
        return {
          manifest: {
            canvas: manifest.canvas || { width: 0, height: 0 },
            tools: manifest.tools || [],
            regions: manifest.regions || [],
            defaultTool: manifest.defaultTool || ""
          }
        };
      }

      function hasArgsState(state) {
        var normalized = normalizeArgsState(state);
        if (normalized.specs.length > 0) {
          return true;
        }
        return !!normalized.raw.trim();
      }

      function hasInteractiveState(state) {
        var normalized = normalizeInteractiveState(state);
        return normalized.manifest.tools.length > 0 || normalized.manifest.regions.length > 0;
      }

      function syncSidebar() {
        var show = hasArgsState(currentArgsState) || hasInteractiveState(currentInteractiveState);
        argsSidebar.classList.toggle("hidden", !show);
        interactiveSection.classList.toggle("hidden", !hasInteractiveState(currentInteractiveState));
      }

      function argMeta(spec) {
        if (spec.type === "bool") {
          return "bool";
        }
        var meta = [spec.type];
        if (spec.min != null || spec.max != null) {
          meta.push((spec.min != null ? spec.min : "−∞") + " … " + (spec.max != null ? spec.max : "∞"));
        }
        return meta.join("  ");
      }

      function argStep(spec) {
        return spec.type === "int" ? "1" : "0.01";
      }

      function syncNumericArg(field, value) {
        var numberInput = field.querySelector('[data-arg-number]');
        var sliderInput = field.querySelector('[data-arg-slider]');
        if (numberInput) {
          numberInput.value = value;
        }
        if (sliderInput) {
          sliderInput.value = value;
        }
      }

      function applyArgsState(state) {
        currentArgsState = normalizeArgsState(state);
        argFields.innerHTML = "";

        currentArgsState.specs.forEach(function(spec) {
          var field = document.createElement("div");
          field.className = "arg-field" + (spec.type === "bool" ? " arg-field--bool" : "");
          field.dataset.argName = spec.name;
          field.dataset.argType = spec.type;

          var label = document.createElement("div");
          label.className = "arg-label";
          label.textContent = spec.name;
          field.appendChild(label);

          if (spec.description) {
            var desc = document.createElement("div");
            desc.className = "arg-desc";
            desc.textContent = spec.description;
            field.appendChild(desc);
          }

          if (spec.type === "bool") {
            var boolLabel = document.createElement("label");
            boolLabel.className = "arg-bool";
            var input = document.createElement("input");
            input.type = "checkbox";
            input.checked = currentArgsState.values[spec.name] === "true";
            input.dataset.argInput = spec.name;
            boolLabel.appendChild(input);
            var text = document.createElement("span");
            text.textContent = "enabled";
            boolLabel.appendChild(text);
            field.appendChild(boolLabel);
          } else {
            var row = document.createElement("div");
            row.className = "arg-number-row";

            var numberInput = document.createElement("input");
            numberInput.type = "number";
            numberInput.className = "arg-number-input";
            numberInput.step = argStep(spec);
            if (spec.min != null) numberInput.min = spec.min;
            if (spec.max != null) numberInput.max = spec.max;
            numberInput.value = currentArgsState.values[spec.name] || "";
            numberInput.dataset.argInput = spec.name;
            numberInput.dataset.argNumber = spec.name;
            row.appendChild(numberInput);

            if (spec.min != null && spec.max != null) {
              var sliderInput = document.createElement("input");
              sliderInput.type = "range";
              sliderInput.className = "arg-slider";
              sliderInput.min = spec.min;
              sliderInput.max = spec.max;
              sliderInput.step = argStep(spec);
              sliderInput.value = currentArgsState.values[spec.name] || "";
              sliderInput.dataset.argSlider = spec.name;
              sliderInput.addEventListener("input", function() {
                syncNumericArg(field, this.value);
              });
              numberInput.addEventListener("input", function() {
                syncNumericArg(field, this.value);
              });
              row.appendChild(sliderInput);
            }

            field.appendChild(row);

            var meta = document.createElement("div");
            meta.className = "arg-meta";
            meta.textContent = argMeta(spec);
            field.appendChild(meta);
          }

          argFields.appendChild(field);
        });

        rawArgsInput.value = currentArgsState.raw || "";
        syncSidebar();
      }

      function ensureSelectedInteractiveTool() {
        var tools = currentInteractiveState.manifest.tools || [];
        if (tools.length === 0) {
          selectedInteractiveTool = "";
          return;
        }

        var found = tools.some(function(tool) {
          return tool.id === selectedInteractiveTool;
        });
        if (found) {
          return;
        }

        if (currentInteractiveState.manifest.defaultTool) {
          selectedInteractiveTool = currentInteractiveState.manifest.defaultTool;
          return;
        }
        selectedInteractiveTool = tools[0].id;
      }

      function renderInteractiveTools() {
        interactiveTools.innerHTML = "";
        var tools = currentInteractiveState.manifest.tools || [];
        tools.forEach(function(tool) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "interactive-tool" + (tool.id === selectedInteractiveTool ? " active" : "");
          button.textContent = tool.label;
          if (tool.description) {
            button.title = tool.description;
          }
          button.addEventListener("click", function() {
            selectedInteractiveTool = tool.id;
            renderInteractiveTools();
          });
          interactiveTools.appendChild(button);
        });
      }

      function renderInteractiveOverlay() {
        var manifest = currentInteractiveState.manifest || {};
        var regions = manifest.regions || [];
        var canvas = manifest.canvas || { width: 0, height: 0 };

        if (previewStage.style.display === "none" || !image.src || regions.length === 0 || !canvas.width || !canvas.height) {
          interactionOverlay.innerHTML = "";
          interactionOverlay.classList.remove("active");
          return;
        }

        interactionOverlay.setAttribute("viewBox", "0 0 " + canvas.width + " " + canvas.height);
        interactionOverlay.innerHTML = "";

        regions.forEach(function(region) {
          var group = document.createElementNS(svgNS, "g");
          var rect = document.createElementNS(svgNS, "rect");
          rect.setAttribute("x", region.x);
          rect.setAttribute("y", region.y);
          rect.setAttribute("width", region.width);
          rect.setAttribute("height", region.height);
          rect.setAttribute("rx", "4");
          rect.setAttribute("ry", "4");
          rect.setAttribute("fill", region.fill || "rgba(125, 211, 252, 0.04)");
          rect.setAttribute("stroke", region.stroke || "rgba(125, 211, 252, 0.35)");
          rect.setAttribute("stroke-width", "1.5");
          rect.setAttribute("class", "interactive-region");
          rect.addEventListener("click", function(ev) {
            ev.preventDefault();
            ev.stopPropagation();
            submitInteractive(region.id);
          });
          if (region.hint) {
            var title = document.createElementNS(svgNS, "title");
            title.textContent = region.hint;
            rect.appendChild(title);
          }
          group.appendChild(rect);

          if (region.label) {
            var text = document.createElementNS(svgNS, "text");
            text.setAttribute("x", region.x + region.width / 2);
            text.setAttribute("y", region.y + region.height / 2);
            text.setAttribute("fill", region.textColor || "#7dd3fc");
            text.setAttribute("class", "interactive-label");
            text.textContent = region.label;
            group.appendChild(text);
          }

          interactionOverlay.appendChild(group);
        });

        interactionOverlay.classList.add("active");
      }

      function applyInteractiveState(state) {
        currentInteractiveState = normalizeInteractiveState(state);
        ensureSelectedInteractiveTool();
        renderInteractiveTools();
        renderInteractiveOverlay();
        syncSidebar();
      }

      function refreshInteractiveState() {
        return fetch("/api/interactive").then(function(res) {
          if (!res.ok) return null;
          return res.json();
        }).then(function(state) {
          if (state) {
            applyInteractiveState(state);
          }
        }).catch(function() {});
      }

      function submitInteractive(regionID) {
        if (!selectedInteractiveTool) {
          window.alert("Select an interactive tool first.");
          return;
        }

        fetch("/api/interactive", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tool: selectedInteractiveTool, region: regionID })
        }).then(function(res) {
          if (!res.ok) {
            return res.text().then(function(text) {
              throw new Error(text || "Failed to update interactive state");
            });
          }
          return res.json();
        }).then(function(state) {
          applyInteractiveState(state);
        }).catch(function(err) {
          window.alert("Failed to update interactive state: " + err.message);
        });
      }

      function collectArgsPayload() {
        var values = {};
        currentArgsState.specs.forEach(function(spec) {
          var input = document.querySelector('[data-arg-input="' + spec.name + '"]');
          if (!input) return;
          if (spec.type === "bool") {
            values[spec.name] = input.checked ? "true" : "false";
          } else {
            values[spec.name] = input.value;
          }
        });
        return {
          values: values,
          raw: rawArgsInput.value || ""
        };
      }

      function refreshArgsState() {
        return fetch("/api/args").then(function(res) {
          if (!res.ok) return null;
          return res.json();
        }).then(function(state) {
          if (state) {
            applyArgsState(state);
          }
        }).catch(function() {});
      }

      function submitArgs() {
        var payload = collectArgsPayload();
        fetch("/api/args", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).then(function(res) {
          if (!res.ok) {
            return res.text().then(function(text) {
              throw new Error(text || "Failed to update args");
            });
          }
          return res.json();
        }).then(function(state) {
          applyArgsState(state);
        }).catch(function(err) {
          window.alert("Failed to update args: " + err.message);
        });
      }

      function resetArgs() {
        fetch("/api/args", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reset: true })
        }).then(function(res) {
          if (!res.ok) {
            return res.text().then(function(text) {
              throw new Error(text || "Failed to reset args");
            });
          }
          return res.json();
        }).then(function(state) {
          applyArgsState(state);
        }).catch(function(err) {
          window.alert("Failed to reset args: " + err.message);
        });
      }

      function updateDebug() {
        fetch("/api/debug", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ debug: !!optDebug.checked })
        });
      }

      function updateOptimisations() {
        var payload = {
          llo: !!optLLO.checked,
          vpype: !!optVPype.checked
        };
        fetch("/api/optimise", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      }

      function handleEvent(ev) {
        currentEventType = ev.type === "log" ? "building" : (ev.type || "");
        switch (ev.type) {
          case "ready":
            setStatus("ready", "status-ready");
            showImage(ev.file);
            refreshArgsState();
            refreshInteractiveState();
            break;
          case "building":
            setStatus("building…", "status-building");
            buildLog.textContent = "";
            showBuildLog();
            refreshArgsState();
            break;
          case "log":
            showBuildLog();
            appendBuildLog(ev.log);
            break;
          case "error":
            setStatus("error", "status-error");
            errorDiv.textContent = ev.msg;
            previewStage.style.display = "none";
            buildLog.style.display = "none";
            errorDiv.style.display = "block";
            break;
        }
        syncDownloadButton();
      }

      function filenameFromDisposition(disposition) {
        if (!disposition) return "";

        var utf8Match = disposition.match(/filename\*=UTF-8''([^;]+)/i);
        if (utf8Match && utf8Match[1]) {
          try {
            return decodeURIComponent(utf8Match[1]);
          } catch (err) {
            return utf8Match[1];
          }
        }

        var plainMatch = disposition.match(/filename="?([^";]+)"?/i);
        if (plainMatch && plainMatch[1]) {
          return plainMatch[1];
        }

        return "";
      }

      function finishGCodeDownload(label) {
        exportingGCode = false;
        downloadGCodeButton.textContent = label;
        syncDownloadButton();
      }

      function downloadGCode() {
        if (exportingGCode) return;

        exportingGCode = true;
        var label = downloadGCodeButton.dataset.label || downloadGCodeButton.textContent;
        downloadGCodeButton.dataset.label = label;
        downloadGCodeButton.textContent = "exporting…";
        syncDownloadButton();

        var flavor = gcodeFlavorSelect.value || "vanilla";
        fetch("/api/export/gcode?flavor=" + encodeURIComponent(flavor)).then(function(res) {
          if (!res.ok) {
            return res.text().then(function(text) {
              throw new Error(text || "Export failed");
            });
          }

          var disposition = res.headers.get("Content-Disposition") || "";
          return res.blob().then(function(blob) {
            return {
              blob: blob,
              filename: filenameFromDisposition(disposition) || "sketch.gcode"
            };
          });
        }).then(function(result) {
          var url = URL.createObjectURL(result.blob);
          var link = document.createElement("a");
          link.href = url;
          link.download = result.filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(function() {
            URL.revokeObjectURL(url);
          }, 1000);
        }).catch(function(err) {
          window.alert("Failed to export G-code: " + err.message);
        }).then(function() {
          finishGCodeDownload(label);
        });
      }

      // SSE: server pushes build state
      function connectSSE() {
        var es = new EventSource("/events");
        es.onmessage = function(msg) {
          handleEvent(JSON.parse(msg.data));
        };
        es.onerror = function() {
          currentEventType = "";
          setStatus("disconnected", "status-error");
          syncDownloadButton();
        };
      }

      // Gallery mode: populate picker and wire up selection
      function initGallery(sketches, currentSketch) {
        galleryMode = true;
        sketchSelect.classList.remove("hidden");
        sketchSelect.innerHTML = "";
        sketches.forEach(function(s) {
          var opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          sketchSelect.appendChild(opt);
        });

        // Set current selection
        if (currentSketch) {
          sketchSelect.value = currentSketch;
        }

        sketchSelect.addEventListener("change", function() {
          var name = this.value;
          setStatus("building…", "status-building");
          buildLog.textContent = "";
          showBuildLog();
          fetch("/api/select?name=" + encodeURIComponent(name)).then(refreshArgsState);
        });
      }

      optDebug.addEventListener("change", updateDebug);
      optLLO.addEventListener("change", updateOptimisations);
      optVPype.addEventListener("change", updateOptimisations);
      downloadGCodeButton.addEventListener("click", downloadGCode);
      applyArgsButton.addEventListener("click", submitArgs);
      resetArgsButton.addEventListener("click", resetArgs);
      image.addEventListener("load", renderInteractiveOverlay);
      rawArgsInput.addEventListener("keydown", function(ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          submitArgs();
        }
      });

      // Boot: fetch initial state, start SSE, optionally trigger first build
      function boot() {
        fetch("/api/sketches").then(function(r) {
          return r.ok ? r.json() : null;
        }).then(function(sketches) {
          return fetch("/api/state").then(function(r) {
            return r.json();
          }).then(function(state) {
            // Start SSE first so we don't miss events
            connectSSE();

            if (sketches && sketches.length > 0) {
              initGallery(sketches, state.sketch);

              // If no image yet, select the first sketch to trigger a build
              if (state.event.type !== "ready") {
                var pick = sketches[0];
                sketchSelect.value = pick;
                fetch("/api/select?name=" + encodeURIComponent(pick));
              }
            }

            // Apply whatever the server's current state is
            if (state.event.type) {
              handleEvent(state.event);
            }
            if (state.logs && state.logs.length > 0 && state.event.type === "building") {
              buildLog.textContent = state.logs.join("\n") + "\n";
              showBuildLog();
              buildLog.scrollTop = buildLog.scrollHeight;
            }
            applyOptimState(state.optim);
            applyDebugState(state.debug);
            applyArgsState(state.args);
            applyInteractiveState(state.interactive);
          });
        }).catch(function(err) {
          setStatus("error", "status-error");
          errorDiv.textContent = "Failed to connect: " + err;
          errorDiv.style.display = "block";
          syncDownloadButton();
        });
      }

      boot();
    </script>
  </body>
</html>
